- name: Create roboshop system user
  ansible.builtin.user:
    name: roboshop
    comment: Roboshop System user
    system: true  # it will make system user
    shell: /sbin/nologin
    home: /app

# Safe to remove directory, because 2nd time if we run it will download freshly. no error if does not exist
- name: remove app directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: Creates app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download {{ component }} application
  ansible.builtin.get_url:
    url: curl -o /tmp/{{ component }}.zip https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component }}.zip

- name: Unzip/extract {{ component }} application
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes  # because we are running in ansible server and task is running at remote server